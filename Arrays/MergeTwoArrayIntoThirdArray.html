<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merge two arrays</title>
</head>
<body>
    <script>
        let arr1 = [10,20,50,60,70]
        let arr2 = [50,40,10,90]
        let arr3 = []

        console.warn(arr1);
        console.warn(arr2)
        for(let i=0; i<arr1.length; i++){
            arr3[i] = arr1[i]
        }
        for(let i =0 ; i<arr2.length; i++){
            arr3[arr1.length + i] = arr2[i]
        }
        console.warn(arr3)
    </script>
</body>
</html>
