<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merge two arrays using while loop</title>
</head>
<body>
    <script>
        // first condition is we have two arrays in a sorted form for this logic 
        let data1 = [10, 20,30, 40,60,200,800]
        let data2 = [13 ,15,17,19,20,100,300]
        let data3 = []

        let d1 = 0;
        let d2 = 0;
        let d3 = 0;

        while(d1<data1.length && d2<data2.length){
            if(data1[d1] < data2[d2]){
                data3[d3] = data1[d1];
                d1++;
                d3++;
            }else {
                data3[d3] = data2[d2]
                d2++;
                d3++;
            }
        }
        while(d1 < data1.length){
            data3[d3] = data1[d1]
            d1++;
            d3++;
        }
        while(d2 < data2.length){
            data3[d3] = data2[d2];
            d2++;
            d3++;
        }
        console.log(data3)
        console.log(data3)
    </script>
</body>
</html>
