        // dynamic logic 

        let arr = [20, 30, 50,60, 10,80,90]

            let element = document.getElementById('element').value;
            for(let i=0; i<arr.length-1; i++){
                if(arr[i] === parseInt( element)){
                    position = i;
                    console.log(`element search on position ${position}`);
                    break;
                }
            }
        })
