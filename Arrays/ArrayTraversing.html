    <input type="text" name="user_input" id="user_input">

    function result(){
        let user_input = document.getElementById('user_input').value;
        
        if(user_input < arr.length && typeof parseInt(user_input) === 'number'&& user_input >= 0){

            console.log(arr[user_input])
        }else {

        }
    }
