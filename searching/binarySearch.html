<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary search</title>
</head>
<body>
    <script>
        console.log('binary search itirative approach')
        // binary search 
        // => it only works on sorted array elements 

       let data = [10, 30, 50, 80, 90, 100]
       let find = 90;
       let start = 0;
       let end = data.length - 1;
       let position = undefined;

       while (start <= end){
            let mid = Math.floor((start + end ) / 2);
            if(data[mid] == find){
                // console.log(data[mid]);
               position = mid;  
               break;  
            }else if(data[mid] < find){
                    start = mid + 1
            }else{
                end = mid - 1;
            }    
       }
       console.log(position)
    </script>
</body>
</html>
