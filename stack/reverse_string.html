<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse string </title>
</head>
<body>
    <script>
         
    console.log('reverse string using stack');

    // stack
     let data = []
     let currentSize = data.length;

     const push = (newVal) =>{
        data[currentSize] = newVal;
        currentSize += 1;
     }

     const pop = () =>{
        let removedElement = data[data.length -1];
       data.length = data.length - 1 ;
       return removedElement;
    }

   
    const reveseStr = (item) =>{
        for(let i =0; i<item.length; i++){
            push(item[i])
        }
        for(let i =0; i<item.length; i++){
            item[i] = pop()
        }
    }
    
    let str = 'HELLO';
    str=str.split("");
    reveseStr(str);
    console.log(str.join(""))
    </script>
</body>
</html>
