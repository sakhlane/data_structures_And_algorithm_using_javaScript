<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bubble sort </title>
</head>
<body>
    <script>
        //  bubble sort 

        let data = [30,20,10,80,70,40,80,50] // sort the data 

        console.warn(data)
        for(let i=0; i<data.length; i++){
            for(let j=0; j<data.length; j++){
                if(data[j] > data[j+1]){
                    let temp = data[j];
                    data[j] = data[j+1];
                    data[j+1] = temp;
                }
            }
        }
        console.warn(data)

    </script>
</body>
</html>
